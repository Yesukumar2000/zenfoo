  #google_api_headers: ^4.1.2
  device_info_plus: ^12.1.0
  google_fonts: ^6.2.1
  photo_view: ^0.15.0
  quill_html_editor: ^2.2.8
  rxdart: ^0.28.0
  external_path: ^2.0.1
  flutter_polyline_points: ^2.1.0 #^3.1.0
  cached_network_image: ^3.3.1
  mime: ^2.0.0
  dio: ^5.8.0+1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  velocity_x: ^4.3.1
  flutter_otp_text_field: ^1.5.1+1
  hugeicons: ^1.1.1
  image_picker: ^1.1.2
  flutter_html: ^3.0.0-beta.2
  in_app_update: ^4.2.4
  just_audio: ^0.9.36
