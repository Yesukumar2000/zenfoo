  app_tracking_transparency: ^2.0.1
  pdf: ^3.11.1
  printing: ^5.13.3
  print_bluetooth_thermal: ^1.1.1
  signature: ^5.5.0

dependency_overrides:
  http: ^1.0.0
  intl: ^0.19.0
  #google_maps_flutter_ios: 2.5.2
  file_picker:
    git:
      url: https://github.com/abdelaziz-mahdy/flutter_file_picker
      ref: fix-flutter-3.27-compile-error
  path_provider_foundation: 2.4.0
  shared_preferences_foundation: 2.4.0
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/en.json
    - assets/svg/
    - assets/images/
    - assets/mapTheme/
    - assets/sounds/

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/play_store.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#9AC444"

