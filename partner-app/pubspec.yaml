  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  url_launcher: ^6.3.0
  firebase_messaging: ^16.1.0
  firebase_crashlytics: ^5.0.7
  video_player: ^2.9.2
  fl_chart: ^1.1.1 #1.0.0
  file_picker: ^10.3.3 #any
  path_provider: ^2.1.4
  geolocator: ^14.0.0 #for user location
  google_maps_flutter: ^2.2.1 #for map
  geocoding: ^4.0.0
  intl: ^0.20.2
